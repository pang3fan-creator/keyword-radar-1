name: Tests

# Off for now: the suite runs locally before a commit (see AGENTS.md), so a red run here was
# only noise. Turn it back on by uncommenting the two triggers; the workflow itself still works.
on:
  # push:
  # pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest mcp
      - run: python -m pytest -q tests
